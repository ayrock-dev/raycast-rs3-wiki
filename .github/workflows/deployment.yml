name: 🚀 Deploy
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: 🔬 Lint & 📐 Format
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: 🟨 Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: 📥 Install deps
        run: pnpm install --frozen-lockfile

      - name: 🧪 Test
        run: pnpm test

      - name: 🔎 Typecheck
        run: pnpm typecheck

      - name: 🔬 Lint & 📐 Format
        run: pnpm check

  build:
    name: 🛠️ Build rs3-wiki
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: 📦 Stage extension with npm
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rs3-wiki"
          git archive HEAD:apps/rs3-wiki | tar -C "$RUNNER_TEMP/rs3-wiki" -xf -
          cp biome.json .gitignore "$RUNNER_TEMP/rs3-wiki/"
          cd "$RUNNER_TEMP/rs3-wiki"
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: 🔬 Lint & 📐 Format
        working-directory: ${{ runner.temp }}/rs3-wiki
        run: npm run check

      - name: 🛠️ Build
        working-directory: ${{ runner.temp }}/rs3-wiki
        run: npm run build

  deploy:
    name: 🚀 Deploy rs3-wiki
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    environment: raycast-store
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15

      - name: 📦 Stage extension with npm
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rs3-wiki"
          git archive HEAD:apps/rs3-wiki | tar -C "$RUNNER_TEMP/rs3-wiki" -xf -
          cp biome.json .gitignore "$RUNNER_TEMP/rs3-wiki/"
          cd "$RUNNER_TEMP/rs3-wiki"
          npm install --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund

      - name: 🚀 Open Raycast Store PR
        env:
          GH_TOKEN: ${{ secrets.RAYCAST_PUBLISH_TOKEN }}
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo 'Set the RAYCAST_PUBLISH_TOKEN secret before triggering this workflow.' >&2
            exit 1
          fi

          account=$(gh api user --jq .login)
          if [[ "$account" != "$GITHUB_REPOSITORY_OWNER" ]]; then
            echo "The publish token belongs to $account, but this repository belongs to $GITHUB_REPOSITORY_OWNER. Use a token for the repository owner." >&2
            exit 1
          fi

          fork="$account/extensions"
          if ! gh repo view "$fork" --json name >/dev/null 2>&1; then
            gh repo fork raycast/extensions --clone=false --remote=false --default-branch-only
          fi

          gh auth setup-git
          checkout_path="$RUNNER_TEMP/raycast-extensions"
          gh repo clone raycast/extensions "$checkout_path" -- --filter=blob:none --depth=1 --sparse
          git -C "$checkout_path" sparse-checkout set extensions/rs3-wiki
          if [[ -e "$checkout_path/extensions/rs3-wiki/package.json" ]]; then
            echo 'extensions/rs3-wiki already exists in raycast/extensions. Update the existing extension instead of submitting a new one.' >&2
            exit 1
          fi

          mkdir -p "$checkout_path/extensions/rs3-wiki"
          git archive HEAD:apps/rs3-wiki | tar -C "$checkout_path/extensions/rs3-wiki" -xf -
          cp "$RUNNER_TEMP/rs3-wiki/package-lock.json" biome.json .gitignore "$checkout_path/extensions/rs3-wiki/"

          branch="rs3-wiki-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git -C "$checkout_path" switch -c "$branch"
          git -C "$checkout_path" config user.name "$account"
          git -C "$checkout_path" config user.email "$account@users.noreply.github.com"
          git -C "$checkout_path" add extensions/rs3-wiki
          git -C "$checkout_path" commit -m 'Add RuneScape Wiki extension'
          git -C "$checkout_path" remote add fork "https://github.com/$fork.git"
          git -C "$checkout_path" push fork "HEAD:refs/heads/$branch"

          gh pr create --repo raycast/extensions --base main --head "$account:$branch" --title 'Add RuneScape Wiki extension' --body 'Add RuneScape Wiki search with previews and structured infobox metadata.' --draft
